name: "Security Analysis (Snyk & Semgrep)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  semgrep_sast:
    name: "Semgrep SAST Code Scan"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep \
            semgrep scan \
            --config=auto \
            --sarif \
            --output=/src/semgrep-results.sarif || true

      - name: Upload Semgrep SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload Semgrep Artifact Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-evidence
          path: semgrep-results.sarif
          retention-days: 14

  snyk_container_scan:
    name: "Snyk Code, Dependencies & Container Scan"
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build Secure Docker Image
        run: |
          docker build \
            -t cinepass-backend:latest \
            -f backend/CinemaTickets.API/Dockerfile \
            backend/CinemaTickets.API

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Open Source & Code Vulnerability Scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --sarif-file-output=snyk-code.sarif || true

      - name: Snyk Container Image Scan (Alpine Hardened)
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test cinepass-backend:latest \
            --file=backend/CinemaTickets.API/Dockerfile \
            --sarif-file-output=snyk-container.sarif || true

      - name: Trivy Container Vulnerability Scan (Dual Verification)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cinepass-backend:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Snyk & Trivy Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-vulnerability-reports
          path: |
            snyk-code.sarif
            snyk-container.sarif
            trivy-results.sarif
          retention-days: 14
