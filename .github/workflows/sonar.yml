name: "SonarQube & SonarCloud Code Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sonar_scan:
    name: "SonarCloud Quality Gate (0 Bugs, 0 Vulnerabilities, 0 Hotspots)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones disabled for accurate Sonar analysis

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore Backend Dependencies
        run: dotnet restore backend/CinemaTickets.sln

      - name: Begin Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"UPT-FAING-EPIS_si784-2026-ii-examen-u1-saulalvarado1" \
            /o:"upt-faing-epis" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/dist/**,**/node_modules/**" \
            /d:sonar.qualitygate.wait=true

      - name: Build Backend Solution
        run: dotnet build backend/CinemaTickets.sln --configuration Release --no-restore

      - name: Run Backend Tests with Coverage
        run: |
          dotnet test backend/CinemaTickets.Tests/CinemaTickets.Tests.csproj \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage;Format=opencover" \
            --results-directory ./TestResults

      - name: End Sonar Analysis & Enforce Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
